name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 1. Format check across the entire repo so it doesn't fail on your modules
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 2. Run Init directly targeting the dev environment configuration
      - name: Terraform Init
        run: terraform -chdir=environments/dev init

      # 3. Validate the dev configuration
      - name: Terraform Validate
        run: terraform -chdir=environments/dev validate

      # 4. Generate the plan for dev
      - name: Terraform Plan
        run: terraform -chdir=environments/dev plan

      # 5. Apply the changes to dev
      - name: Terraform Apply
        run: terraform -chdir=environments/dev apply -auto-approve