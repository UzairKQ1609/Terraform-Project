name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Global environment variables for all steps
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-2"
      # Mapping your tfvars directly into GitHub environment variables
      TF_VAR_aws_region: "us-east-2"
      TF_VAR_instance_type: "t3.micro"
      TF_VAR_ami_id: "ami-0fe18bc3cfa53a248"
      TF_VAR_key_name: "soch-dev-server-key-pair-tf"
      TF_VAR_environment: "dev"
      TF_VAR_bucket_name: "soch-dev-bucket-uzair-2026"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=environments/dev init

      - name: Terraform Validate
        run: terraform -chdir=environments/dev validate

      - name: Terraform Plan
        run: terraform -chdir=environments/dev plan

      - name: Terraform Apply
        run: terraform -chdir=environments/dev apply -auto-approve